<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperture & Thickness Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 22px;
            padding: 15px;
            background-color: #eef6ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            display: none;
        }

        .result-box p {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-all;
        }

        .error {
            background-color: #ffeef0;
            border-left-color: #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Optical Parameter Calculator</h2>
        
        <div class="input-group">
            <label for="pInput">Aperture Diameter (p):</label>
            <input type="number" id="pInput" step="any" placeholder="Enter value for p">
        </div>

        <div class="input-group">
            <label for="rInput">Centre Thickness (r):</label>
            <input type="number" id="rInput" step="any" placeholder="Enter value for r">
        </div>

        <button onclick="calculateF()">Calculate f</button>

        <div id="resultBox" class="result-box">
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        function calculateF() {
            // Retrieve input values
            const p = parseFloat(document.getElementById('pInput').value);
            const r = parseFloat(document.getElementById('rInput').value);
            
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            // Reset box state
            resultBox.classList.remove('error');
            resultBox.style.display = 'none';

            // Validate inputs
            if (isNaN(p) || isNaN(r)) {
                resultText.textContent = "Please enter valid numbers for both inputs.";
                resultBox.classList.add('error');
                resultBox.style.display = 'block';
                return;
            }

            if (r === 0 || p === 0) {
                resultText.textContent = "Values cannot be zero (division by zero error).";
                resultBox.classList.add('error');
                resultBox.style.display = 'block';
                return;
            }

            // Perform the exact mathematical formula using JavaScript's Math object:
            // f = (r + p * Math.tan(Math.atan(p / r) - Math.atan(r / p))) / 4
            const f = (r + p * Math.tan(
                Math.atan(p / r) - Math.atan(r / p)
            )) / 4;

            // Display result
            resultText.textContent = `f = ${f}`;
            resultBox.style.display = 'block';
        }
    </script>

</body>
</html>
